name: Secrets Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest
    env:
      SECRET_CHECK: ${{ secrets.MY_SECRET_MESSAGE }}
    steps:
      - name: Confirm secret is set without printing it
        run: |
          if [ -n "$SECRET_CHECK" ]; then
            echo "The secret is set: true"
          else
            echo "The secret is set: false"
          fi

      - name: Try printing the secret directly
        run: 'echo "Direct print attempt: ${{ secrets.MY_SECRET_MESSAGE }}"'
