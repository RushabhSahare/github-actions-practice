name: Secrets as Env Vars

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  use-secret-env:
    runs-on: ubuntu-latest
    steps:
      - name: Use secret via environment variable
        env:
          MY_MESSAGE: ${{ secrets.MY_SECRET_MESSAGE }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "$MY_MESSAGE" ]; then
            echo "MY_SECRET_MESSAGE was passed into this step as an env var: true"
          fi
          if [ -n "$DOCKER_USER" ]; then
            echo "DOCKER_USERNAME was passed into this step as an env var: true"
          fi
