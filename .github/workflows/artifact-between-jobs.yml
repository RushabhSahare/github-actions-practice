name: Artifact Between Jobs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-file:
    runs-on: ubuntu-latest
    steps:
      - name: Create a file
        run: |
          echo "This file was created in job 1" > shared-data.txt
          echo "Timestamp: $(date -u)" >> shared-data.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-data
          path: shared-data.txt

  read-file:
    runs-on: ubuntu-latest
    needs: [generate-file]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: shared-data

      - name: Print file contents
        run: cat shared-data.txt
