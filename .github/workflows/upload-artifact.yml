name: Upload Artifact Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a report file
        run: |
          echo "Test Report" > report.txt
          echo "Generated at: $(date -u)" >> report.txt
          echo "Status: All checks passed" >> report.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.txt
